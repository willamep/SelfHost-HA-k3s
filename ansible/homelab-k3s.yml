- name: Deploy WireGuard
  hosts: wireguard
  roles:
    - role: wireguard
      tags: ['wireguard']

- name: Deploy NFS
  hosts: nfs_server
  roles:
    - role: nfs_server
      tags: ['nfs_server']

- name: Deploy HA k3s control plane
  hosts: servers
  serial: [1, 2] # batch1 = init-server; batch2 = join-servers
  roles:
    - role: k3s_servers
      tags: ['k3s_servers']

- name: Deploy HA k3s agents
  hosts: agents
  roles:
    - role: k3s_agents
      tags: ['k3s_agents']

- name: Deploy nfs-provisioner
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: nfs-provisioner
      tags: ['nfs-provisioner']

- name: Install node_exporter
  hosts: proxmox:nfs_server:wireguard:nextcloud:victoriametrics
  roles:
    - role: node_exporter
      tags: ['node_exporter']

- name: Install pve-exporter
  hosts: proxmox
  gather_facts: false # роль не использует факты; не роняет прогон, если ноды недоступны
  roles:
    - role: pve_exporter
      tags: ['pve_exporter']

# VictoriaMetrics single: хранилище метрик для remote_write из кластера.
# Ставим ДО monitoring, чтобы Prometheus было куда писать при старте.
- name: Deploy VictoriaMetrics
  hosts: victoriametrics
  become: true
  roles:
    - role: victoriametrics
      tags: ['victoriametrics']

- name: Configure traefik ingress controller
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: traefik
      tags: ['traefik']

- name: Deploy cert-manager
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: cert_manager
      tags: ['cert_manager']

- name: Deploy monitoring
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: monitoring
      tags: ['monitoring']

- name: Install docker on nextcloud VM
  hosts: nextcloud
  become: true
  roles:
    - role: docker
      tags: ['docker']

- name: Deploy nextcloud stack
  hosts: nextcloud
  become: true
  roles:
    - role: nextcloud_vm
      tags: ['nextcloud_vm']

- name: Configure nextcloud ingress (cluster traefik -> VM)
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: nextcloud_ingress
      tags: ['nextcloud_ingress']
