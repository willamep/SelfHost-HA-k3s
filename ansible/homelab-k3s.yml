- name: Install node_exporter
  hosts: nfs-server:wireguard
  roles:
    - role: node_exporter
      tags: ['node_exporter']

- name: Install pve-exporter
  hosts: proxmox
  gather_facts: false # роль не использует факты; не роняет прогон, если ноды недоступны
  roles:
    - role: pve_exporter
      tags: ['pve_exporter']

- name: Configure traefik ingress controller
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: traefik
      tags: ['traefik']

- name: Deploy cert-manager
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: cert_manager
      tags: ['cert_manager']

- name: Deploy monitoring
  hosts: localhost
  run_once: true
  become: false
  roles:
    - role: monitoring
      tags: ['monitoring']
