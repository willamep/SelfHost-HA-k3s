#       {% endfor %}
#       {% endfor %}
#     marker: "# {mark} ANSIBLE MANAGED BLOCK"
#     create: true
#     mode: "0644"
#   notify: Reexport NFS shares

- name: Apply NFS exports
  ansible.builtin.command: exportfs -arv
  changed_when: true

- name: Enable and start nfs-kernel-server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    enabled: true
    state: started
