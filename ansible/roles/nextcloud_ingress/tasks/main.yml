---
- name: Ensure nextcloud namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ nextcloud_namespace }}"

# HSTS ставит traefik; ingress ссылается на мидлварь через аннотацию
- name: Apply HSTS middleware
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/templates/hsts-middleware.yaml.j2') | from_yaml }}"

- name: Apply Service (selectorless)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/templates/service.yaml.j2') | from_yaml }}"

- name: Apply EndpointSlice pointing at the VM
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/templates/endpointslice.yaml.j2') | from_yaml }}"

- name: Apply Ingress
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/templates/ingress.yaml.j2') | from_yaml }}"
