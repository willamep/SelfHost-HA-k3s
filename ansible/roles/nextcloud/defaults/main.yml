nextcloud_namespace: nextcloud
nextcloud_release_name: nextcloud
nextcloud_admin_user: admin  # переопределяется в group_vars/all
nextcloud_db_name: nextcloud
nextcloud_db_user: nextcloud
nextcloud_storage:
  app: 8Gi        # config/, apps/, служебный data/
  postgresql: 5Gi # БД
# local-path (k3s built-in) для обоих PVC: на nfs-client с all_squash не работает
# chown — postgres не может владеть каталогом данных, entrypoint nextcloud
# не может раскатать код под www-data; пользовательские файлы остаются на NFS
nextcloud_storage_class: local-path
# Точка монтирования inline NFS-тома с пользовательскими файлами;
# внутри Nextcloud подключается как External storage типа Local
nextcloud_user_files_mount: /mnt/user-files
# Имя маунта в Nextcloud (виден пользователям как каталог /<имя>)
nextcloud_external_mount_name: user-files
# Час начала окна обслуживания (UTC): 20:00 UTC = 03:00 по +07
nextcloud_maintenance_window_start: 20
