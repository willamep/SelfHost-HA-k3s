---
- name: Add nextcloud Helm repo
  kubernetes.core.helm_repository:
    name: "{{ nextcloud_chart_repo_name }}"
    repo_url: "{{ nextcloud_chart_repo_url }}"

- name: Deploy nextcloud
  kubernetes.core.helm:
    name: "{{ nextcloud_release_name }}"
    chart_ref: "{{ nextcloud_chart_ref }}"
    release_namespace: "{{ nextcloud_namespace }}"
    create_namespace: true
    update_repo_cache: true
    values: "{{ lookup('template', role_path + '/templates/values.yaml.j2') | from_yaml }}"

# HSTS ставит traefik; ingress ссылается на мидлварь через аннотацию
- name: Apply HSTS middleware
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/templates/hsts-middleware.yaml.j2') | from_yaml }}"

# Readiness-проба чарта проходит только после завершения инсталляции Nextcloud,
# поэтому Available-деплоймент — гейт для occ-команд ниже
- name: Wait for nextcloud deployment ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: "{{ nextcloud_release_name }}"
    namespace: "{{ nextcloud_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 600

- name: Get nextcloud pod
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ nextcloud_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=nextcloud
    field_selectors:
      - status.phase=Running
  register: nextcloud_pods

- name: Enable files_external app
  kubernetes.core.k8s_exec:
    namespace: "{{ nextcloud_namespace }}"
    pod: "{{ nextcloud_pods.resources[0].metadata.name }}"
    container: nextcloud
    command: su -s /bin/sh www-data -c "php occ app:enable files_external"
  register: nextcloud_files_external_app
  changed_when: "'already enabled' not in nextcloud_files_external_app.stdout"

- name: List external mounts
  kubernetes.core.k8s_exec:
    namespace: "{{ nextcloud_namespace }}"
    pod: "{{ nextcloud_pods.resources[0].metadata.name }}"
    container: nextcloud
    command: su -s /bin/sh www-data -c "php occ files_external:list --output=json"
  register: nextcloud_external_mounts
  changed_when: false

- name: Create external mount for user files
  kubernetes.core.k8s_exec:
    namespace: "{{ nextcloud_namespace }}"
    pod: "{{ nextcloud_pods.resources[0].metadata.name }}"
    container: nextcloud
    command: >-
      su -s /bin/sh www-data -c
      "php occ files_external:create {{ nextcloud_external_mount_name }}
      local null::null -c datadir={{ nextcloud_user_files_mount }}"
  when: >-
    ('/' ~ nextcloud_external_mount_name) not in
    (nextcloud_external_mounts.stdout | from_json | map(attribute='mount_point') | list)

- name: Get background jobs mode
  kubernetes.core.k8s_exec:
    namespace: "{{ nextcloud_namespace }}"
    pod: "{{ nextcloud_pods.resources[0].metadata.name }}"
    container: nextcloud
    # --default-value: без него occ возвращает rc=1, если ключ ещё не записан
    command: su -s /bin/sh www-data -c "php occ config:app:get core backgroundjobs_mode --default-value=ajax"
  register: nextcloud_backgroundjobs_mode
  changed_when: false

- name: Switch background jobs to cron
  kubernetes.core.k8s_exec:
    namespace: "{{ nextcloud_namespace }}"
    pod: "{{ nextcloud_pods.resources[0].metadata.name }}"
    container: nextcloud
    command: su -s /bin/sh www-data -c "php occ background:cron"
  when: "'cron' not in nextcloud_backgroundjobs_mode.stdout"
