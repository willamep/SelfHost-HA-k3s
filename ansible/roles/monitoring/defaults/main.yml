grafana_admin_username: "admin"
monitoring_namespace: monitoring
monitoring_release_name: kube-prometheus
# Локальный буфер: retention покрывает окна алертов (for:/rate); долгая история — в VM.
# ⚠️ если появятся правила с окном > этого значения — поднять.
monitoring_retention: 2d
monitoring_prometheus_replicas: 2
monitoring_alertmanager_replicas: 2
monitoring_storage:
  prometheus: 10Gi   # local-path буфер на 2d, не долговременное хранилище
  alertmanager: 2Gi
  grafana: 5Gi
