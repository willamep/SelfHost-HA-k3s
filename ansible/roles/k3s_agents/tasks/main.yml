- name: Install nfs-common
  apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Check current K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_current_version_cmd
  failed_when: false
  changed_when: false

- name: Set facts for installation condition
  ansible.builtin.set_fact:
    needs_k3s_install: >-
      {{
        k3s_current_version_cmd.rc != 0 or 
        k3s_version not in k3s_current_version_cmd.stdout
      }}

- name: Fetch k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: "0755"
  when: needs_k3s_install

- name: Install k3s as agent
  ansible.builtin.command: /tmp/install-k3s.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: >-
      agent --server {{ k3s_server_url }}
  when: needs_k3s_install

- name: Wait until K3s node is Ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl wait
    --for=condition=Ready node/{{ inventory_hostname }}
    --timeout=120s
  delegate_to: "{{ k3s_init_host }}"
  changed_when: false

- name: Label agent nodes as worker
  ansible.builtin.command: >-
    kubectl label node {{ inventory_hostname }}
    node-role.kubernetes.io/worker=worker
    --overwrite
  delegate_to: "{{ k3s_init_host }}"
  changed_when: false

- name: Delete k3s installer
  ansible.builtin.file:
    path: /tmp/install-k3s.sh
    state: absent