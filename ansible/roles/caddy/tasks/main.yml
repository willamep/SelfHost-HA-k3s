# Install Caddy
- name: Ensure dependencies are installed
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
    state: present
    update_cache: true

- name: Add Caddy repository
  ansible.builtin.deb822_repository:
    name: caddy
    uris: "{{ caddy_apt_repository_url }}"
    signed_by: "{{ caddy_apt_gpg_key }}"
    components: "{{ caddy_apt_repository_components }}"
    suites: "{{ caddy_apt_repository_suites }}"
    types: "{{ caddy_apt_repository_types }}"
    state: present
    enabled: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Caddy
  ansible.builtin.apt:
    name: "{{ caddy_package }}"
    state: "{{ caddy_package_state }}"
  notify: Restart Caddy

- name: Ensure Caddy service is running
  ansible.builtin.systemd_service:
    name: caddy
    state: "{{ caddy_service_state }}"
    enabled: "{{ caddy_service_enabled }}"

