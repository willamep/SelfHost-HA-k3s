---
- name: Deploy cert-manager
  kubernetes.core.helm:
    name: "{{ cert_manager_release_name }}"
    chart_ref: "{{ cert_manager_chart_ref }}"
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    wait: true  # webhook должен подняться до применения ClusterIssuer
    values:
      crds:
        enabled: true

- name: Apply Let's Encrypt ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/templates/clusterissuer.yaml.j2') | from_yaml }}"
