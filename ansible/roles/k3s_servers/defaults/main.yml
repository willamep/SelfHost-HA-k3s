# ── k3s ──────────────────────
# Remove the ability to use servers for non-tolerant pods
k3s_node_taint: "CriticalAddonsOnly=true:NoExecute"

# ── kube-vip ──────────────────────
kube_vip_version: "v1.2.1"
kube_vip_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
kube_vip_port: "6443"
kube_vip_cidr: "32"
kube_vip_arp: "true"
kube_vip_lease_duration: "15"
kube_vip_renew_deadline: "10"
kube_vip_retry_period: "2"
kube_vip_prometheus_server: ":2112"
