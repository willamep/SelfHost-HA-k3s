---
- name: Install k3s with embedded etcd (--cluster-init)
  ansible.builtin.command: /tmp/install-k3s.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: >-
      server --cluster-init
      --tls-san {{ kube_vip_address }}
      --node-taint {{ k3s_node_taint }}
      --disable servicelb
  args:
    creates: /etc/systemd/system/k3s.service

- name: Wait until K3s node is Ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl wait
    --for=condition=Ready node --all
    --timeout=120s
  changed_when: false