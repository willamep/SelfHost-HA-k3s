apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/willamep/selfhost-ha-k3s.git
        revision: gitops-dev
        files:
          - path: kubernetes/infrastructure/*/Source.json

  # 1. БАЗОВЫЙ ШАБЛОН (Для Git-приложений по умолчанию)
  template:
    metadata:
      name: '{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ default "0" (index . "wave") }}'
    spec:
      project: infrastructure

      source:
        repoURL: '{{ default "https://github.com/willamep/selfhost-ha-k3s.git" (index . "repoURL") }}'
        targetRevision: '{{ default "gitops-dev" (index . "targetRevision") }}'
        path: '{{ default .path.path (index . "path") }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

  # 2. ДИНАМИЧЕСКИЙ СТРУКТУРНЫЙ ПАТЧ (Переопределяет структуру для Helm)
  templatePatch: |
    {{- if eq .type "helm" }}
    spec:
      source: null
      sources:
        - repoURL: '{{ .repoURL }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .targetRevision }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{ .path.path }}/values.yaml

        - repoURL: https://github.com/willamep/selfhost-ha-k3s.git
          targetRevision: gitops-dev
          ref: values

        {{- if and (index . "hasManifests") .hasManifests }}
        - repoURL: https://github.com/willamep/selfhost-ha-k3s.git
          targetRevision: gitops-dev
          path: '{{ .path.path }}/manifests'
        {{- end }}
    {{- end }}
